name: forecast

on:
  # TODO: re-enable the 6-hourly schedule once the pipeline works end to end.
  # schedule:
  #   - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write # TODO: needed only for the data/history commit step below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install pipeline
        run: pip install -e pipeline

      - name: Run pipeline
        env:
          # TODO: add the FIRMS_MAP_KEY repository secret (Settings > Secrets and variables > Actions)
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        # TODO: the entry point currently exits with an error until the pipeline is implemented
        run: python -m hazier

      # TODO: if a source fails, fall back to the last published forecast.json and flag it

      # TODO: commit the light history in data/history/ to keep the cron alive
      # (scheduled workflows are disabled after 60 days without repository activity).
      # Never commit forecast.json itself.

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      # TODO: confirm the path where the pipeline writes forecast.json
      - name: Add forecast to site
        run: cp pipeline/forecast.json web/dist/forecast.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
