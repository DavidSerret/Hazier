name: forecast

on:
  # TODO: re-enable the 6-hourly schedule after a first successful manual run on GitHub.
  # schedule:
  #   - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write # the run history in data/history is committed back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install pipeline
        run: pip install -e pipeline

      # Writes pipeline/output/site/forecast.json and appends a line to data/history/runs.csv.
      # Exits non-zero when no usable forecast can be made (FIRMS or winds down, or validation
      # failed). The build and deploy steps below are then skipped, so GitHub Pages keeps
      # serving the last valid forecast; the failed run is still recorded in the history.
      - name: Run pipeline
        env:
          # TODO: add the FIRMS_MAP_KEY repository secret (Settings > Secrets and variables > Actions)
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python -m hazier

      # Runs even when the pipeline failed: the history keeps the scheduled workflow alive
      # (scheduled workflows are disabled after 60 days without repository activity) and
      # records failures for verification. forecast.json itself is never committed.
      - name: Commit run history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Forecast run history $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Add forecast to site
        run: cp pipeline/output/site/forecast.json web/dist/forecast.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
