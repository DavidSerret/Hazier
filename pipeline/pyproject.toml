[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hazier"
version = "0.1.0"
description = "Haze forecaster for Malaysia and the southern ASEAN region"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pandas",
    "numpy",
    # GRIB decoding. Pure pip on Windows (bundled library) and Linux (pulls eccodeslib).
    "eccodes>=2.40",
    "ecmwf-opendata>=0.3.20",  # ECMWF open data winds
    "cdsapi>=0.7.7",  # Copernicus Atmosphere Data Store (CAMS map layer)
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "matplotlib",  # debug plots only, never imported by the pipeline itself
]

[tool.setuptools.packages.find]
include = ["hazier*"]

[tool.setuptools.package-data]
hazier = ["data/*.geojson"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
