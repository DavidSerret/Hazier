[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hazier"
version = "0.1.0"
description = "Haze forecaster for Malaysia and the southern ASEAN region"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pandas",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "matplotlib",  # debug plots only, never imported by the pipeline itself
]

[tool.setuptools.packages.find]
include = ["hazier*"]

[tool.setuptools.package-data]
hazier = ["data/*.geojson"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
