<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f14" />
    <title>Hazier</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body class="text-slate-100 antialiased">
    <div id="map"></div>

    <!--
      Top on mobile (the zone card, then warnings; the map stays usable around them).
      Left panel on desktop (card, warnings, zone list), ending above the timeline.
    -->
    <div
      id="panel"
      class="pointer-events-none fixed inset-x-0 top-0 z-20 flex flex-col gap-1.5 p-2 md:bottom-[var(--timeline-h,7rem)] md:right-auto md:w-80 md:overflow-y-auto md:border-r md:border-white/10 md:bg-[#0b0f14]/90 md:p-3 md:pointer-events-auto"
    >
      <section
        id="card"
        hidden
        class="pointer-events-auto rounded-lg border border-white/15 bg-[#0b0f14]/90 shadow-lg backdrop-blur"
      >
        <button
          id="card-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="card-detail"
          class="relative block w-full p-2.5 pr-7 text-left"
        >
          <span id="card-chevron" class="absolute right-2.5 top-2.5 text-slate-400" aria-hidden="true">▾</span>
          <div id="card-summary"></div>
        </button>
        <div
          id="card-detail"
          hidden
          class="max-h-[45vh] overflow-y-auto border-t border-white/10 p-2.5 md:max-h-none"
        ></div>
      </section>

      <div id="banners" class="flex flex-col gap-1.5"></div>

      <div id="zones" class="hidden md:mt-2 md:block"></div>
    </div>

    <!-- Load failure -->
    <div
      id="error"
      hidden
      class="fixed inset-0 z-30 flex items-center justify-center bg-[#0b0f14]/80 p-6"
    >
      <div class="max-w-sm rounded-xl border border-white/15 bg-[#12171e] p-5 text-center shadow-xl">
        <h1 class="mb-2 text-base font-semibold">Hazier cannot show the forecast</h1>
        <p id="error-message" class="mb-4 text-sm text-slate-300"></p>
        <button
          id="error-retry"
          type="button"
          class="rounded-md bg-sky-600 px-4 py-2 text-sm font-medium hover:bg-sky-500"
        >
          Try again
        </button>
      </div>
    </div>

    <div id="loading" class="fixed left-1/2 top-1/2 z-10 -translate-x-1/2 text-sm text-slate-300">
      Loading forecast…
    </div>

    <!-- Info panel: opened from the "i" button in the timeline -->
    <div
      id="info"
      hidden
      role="dialog"
      aria-label="About this forecast"
      class="fixed inset-x-2 bottom-[calc(var(--timeline-h,7rem)+0.5rem)] z-30 max-h-[60vh] overflow-y-auto rounded-lg border border-white/15 bg-[#12171e] p-3 text-sm leading-snug text-slate-200 shadow-xl md:left-auto md:w-[28rem]"
    >
      <button
        id="info-close"
        type="button"
        aria-label="Close"
        class="float-right ml-2 rounded px-2 py-0.5 text-lg leading-none text-slate-400 hover:text-slate-100"
      >
        ×
      </button>
      <div id="info-body"></div>
    </div>

    <!-- Timeline -->
    <div
      id="timeline"
      hidden
      class="fixed inset-x-0 bottom-0 z-20 border-t border-white/10 bg-[#0b0f14]/90 px-3 pb-[max(0.5rem,env(safe-area-inset-bottom))] pt-2 backdrop-blur"
    >
      <div class="mb-1 flex items-center justify-between gap-2 text-sm">
        <span id="hour-label" class="font-medium"></span>
        <button
          id="info-button"
          type="button"
          aria-label="About this forecast, limitations and credits"
          aria-expanded="false"
          class="flex h-7 shrink-0 items-center gap-1.5 rounded-full border border-white/20 px-2.5 text-xs text-slate-300 hover:bg-white/10"
        >
          <span aria-hidden="true" class="font-serif italic">i</span>
          <span>Info and credits</span>
        </button>
      </div>
      <div class="flex items-start gap-3">
        <button
          id="play"
          type="button"
          aria-label="Play"
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-sky-600 text-white hover:bg-sky-500"
        ></button>
        <div class="min-w-0 flex-1">
          <input
            id="hour"
            type="range"
            min="0"
            max="72"
            step="1"
            value="0"
            aria-label="Forecast hour"
            class="w-full"
          />
          <div id="ticks" class="relative mx-2 h-8"></div>
        </div>
      </div>
      <ul id="legend" class="flex flex-wrap gap-x-3 gap-y-0.5 text-[11px] text-slate-300"></ul>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
