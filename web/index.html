<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f14" />
    <title>Hazier</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body class="text-slate-100 antialiased">
    <div id="map"></div>

    <!-- Warnings: stale forecast, degraded or failed sources, sample data -->
    <div
      id="banners"
      class="pointer-events-none fixed inset-x-0 top-0 z-20 flex flex-col items-start gap-1.5 p-2"
    ></div>

    <!-- Load failure -->
    <div
      id="error"
      hidden
      class="fixed inset-0 z-30 flex items-center justify-center bg-[#0b0f14]/80 p-6"
    >
      <div class="max-w-sm rounded-xl border border-white/15 bg-[#12171e] p-5 text-center shadow-xl">
        <h1 class="mb-2 text-base font-semibold">Hazier cannot show the forecast</h1>
        <p id="error-message" class="mb-4 text-sm text-slate-300"></p>
        <button
          id="error-retry"
          type="button"
          class="rounded-md bg-sky-600 px-4 py-2 text-sm font-medium hover:bg-sky-500"
        >
          Try again
        </button>
      </div>
    </div>

    <div id="loading" class="fixed left-1/2 top-1/2 z-10 -translate-x-1/2 text-sm text-slate-300">
      Loading forecast…
    </div>

    <div class="pointer-events-none fixed inset-x-0 bottom-0 z-20 flex flex-col">
      <!-- Temporary forecast-hour control (the real timeline comes in part B) -->
      <div
        id="hour-control"
        hidden
        class="pointer-events-auto mx-2 mb-2 rounded-lg border border-white/10 bg-[#0b0f14]/80 p-2.5 backdrop-blur"
      >
        <div class="mb-1 flex items-baseline justify-between gap-3 text-sm">
          <span id="hour-label" class="font-medium"></span>
          <span class="text-[10px] uppercase tracking-wide text-slate-500">temporary control</span>
        </div>
        <input
          id="hour"
          type="range"
          min="0"
          max="72"
          step="1"
          value="0"
          aria-label="Forecast hour"
          class="w-full accent-sky-500"
        />
        <p id="zone-readout" class="mt-1 text-sm text-slate-200"></p>
        <ul id="legend" class="mt-1.5 flex flex-wrap gap-x-3 gap-y-0.5 text-[11px] text-slate-300"></ul>
      </div>

      <footer
        id="footer"
        class="pointer-events-auto bg-[#0b0f14]/85 px-3 py-1.5 pb-[max(0.375rem,env(safe-area-inset-bottom))] text-[10.5px] leading-snug text-slate-400"
      ></footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
